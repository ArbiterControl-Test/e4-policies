  - pattern: "**/package.json"
    label: "Dependencies (npm, pnpm, yarn, bun)"
    risk_class: "standard"
  - pattern: "**/package-lock.json"
    label: "Dependencies (npm, pnpm, yarn, bun)"
    risk_class: "standard"
  - pattern: "**/pnpm-lock.yaml"
