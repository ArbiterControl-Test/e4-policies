  # Add every file outside .github/ that your workflows or actions run or read: each local action's code and
  # Dockerfile (for example dist/index.js beside a root action.yml), the targets of symlinks under .github/, and the
  # folders your workflows run scripts from (for example scripts/ci/**). List each here, with the requirement below,
  # and in check_definitions.paths. Arbiter cannot see which files a workflow runs; an unlisted file is not protected.

# What a protected change needs before Arbiter authorizes it. Approvals and checks are read from GitHub.
evidence_requirements:
  - path_pattern: "infrastructure/**"
    required_approvals: { team: "ArbiterControl-Test/e4-platform", min_approvals: 1 }
    required_checks:
      - name: "terraform-plan"
        app_id: 15368            # GitHub Actions
        workflow: ".github/workflows/terraform.yml"   # the workflow that runs `terraform plan`
  - path_pattern: ".github/**"
    required_approvals: { team: "ArbiterControl-Test/e4-platform", min_approvals: 1 }
  - path_pattern: "**/action.yml"
    required_approvals: { team: "ArbiterControl-Test/e4-platform", min_approvals: 1 }
  - path_pattern: "**/action.yaml"
    required_approvals: { team: "ArbiterControl-Test/e4-platform", min_approvals: 1 }
  # Dependency changes (UC3): a passing dependency-check from your trusted repository, which pull requests cannot
  # change, and a platform approval. The trusted entry is written once (&uc3_check): replace acme/arbiter-trusted
  # and the commit there with yours (starter/trusted-workflows/README.md); every rule below uses it (*uc3_check).
  # npm, pnpm, yarn, bun
  - path_pattern: "**/package.json"
    required_approvals: { team: "ArbiterControl-Test/e4-platform", min_approvals: 1 }
    required_checks:
      - &uc3_check
        name: "dependency-check"
        trusted_workflow: "acme/arbiter-trusted/.github/workflows/dependency-check.yml"
        trusted_workflow_sha: "0000000000000000000000000000000000000000"   # SET-ME: your trusted repo's commit
