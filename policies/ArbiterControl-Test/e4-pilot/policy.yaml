# Starter policy (ARB-293). Copy to policies/<your-org>/<your-repo>/policy.yaml in your policy repo, then replace
# `acme` with your GitHub organization and the team names with your own teams (org/slug).
version: "1.0"

# AI provenance files are optional at first; turn this on once your agents write .ai/provenance.json.
provenance:
  required: false
  required_fields: [session_id, agent, files_modified, generated_at]
  artifact_path: ".ai/provenance.json"

# Paths Arbiter governs. Anything else (docs, app code) is allowed without extra evidence.
protected_paths:
  # IAM (ARB-326): add every folder that defines or feeds IAM here, with risk_class "high"; the escalation below holds
  # each change for ArbiterControl-Test/e4-security. The README's section on IAM lists what to include.
  # For example:
  #   - pattern: "modules/iam/**"
  #     label: "IAM modules"
  #     risk_class: "high"
  #   - pattern: "policies/iam/**"
  #     label: "IAM policy files"
  #     risk_class: "high"
  #   - pattern: "environments/*/iam.tfvars"
  #     label: "IAM variables"
  #     risk_class: "high"
  - pattern: "infrastructure/**"
    label: "Infrastructure (Terraform)"
    risk_class: "standard"
  # CI configuration (ARB-317): workflows, local actions, CODEOWNERS, Dependabot, and actions defined anywhere.
  - pattern: ".github/**"
    label: "GitHub configuration (workflows, actions, CODEOWNERS, Dependabot)"
    risk_class: "standard"
  - pattern: "**/action.yml"
    label: "Actions defined in the repository"
    risk_class: "standard"
  - pattern: "**/action.yaml"
    label: "Actions defined in the repository"
    risk_class: "standard"
  # Dependency files (UC3, ARB-318), at any depth. Each is also an evidence requirement below. Files and ecosystems
  # not listed here are not protected: add patterns for yours (starter/README.md, "Dependency changes").
