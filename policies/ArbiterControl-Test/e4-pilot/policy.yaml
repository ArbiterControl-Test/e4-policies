# Checks that must pass on every pull request, whatever it changes (UC4). The secret scan runs in your separate,
# protected trusted repository, which pull requests cannot change: only its result, from the pinned commit, counts.
# Replace acme/arbiter-trusted and the commit with yours (starter/trusted-workflows/README.md). Without a trusted
# repository, use the ordinary form in starter/README.md ("Secret scan without a trusted repository").
always_required_checks:
  - name: "gitleaks"
    app_id: 15368                                # GitHub Actions
    workflow: ".github/workflows/arbiter-secret-scan.yml"

# Changes to how checks run (workflows and actions) can make a required check pass whatever it tests. While a pull
# request changes them, its check results count only if this team also approves. The two gitleaks files are listed
# so that adding or editing one is a reviewed change, even though the starter scans read neither.
check_definitions:
  paths: ["**/.gitleaks.toml", "**/.gitleaksignore"]
  approvers: { team: "ArbiterControl-Test/e4-security", min_approvals: 1 }

# High-risk changes (IAM) are held until the security team approves on GitHub.
escalation_conditions:
  - trigger: "iam_change_needs_security_review"
    description: "IAM changes need a security team approval"
    condition: { risk_class: "high", when: "human_approval_required" }
    category: "policy_declared_human_approval_required"
    cleared_by: { team: "ArbiterControl-Test/e4-security", min_approvals: 1 }

failure_defaults:
  protected_path_unavailable_input: DENY
