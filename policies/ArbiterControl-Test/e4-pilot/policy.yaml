  - pattern: "**/yarn.lock"
    label: "Dependencies (npm, pnpm, yarn, bun)"
    risk_class: "standard"
  - pattern: "**/npm-shrinkwrap.json"
    label: "Dependencies (npm, pnpm, yarn, bun)"
    risk_class: "standard"
  - pattern: "**/bun.lock*"
    label: "Dependencies (npm, pnpm, yarn, bun)"
    risk_class: "standard"
  - pattern: "**/pnpm-workspace.yaml"
