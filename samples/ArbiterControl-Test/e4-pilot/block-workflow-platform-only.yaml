# Must deny: a workflow change approved by a platform team member only. A workflow change changes how checks run, so the
# trusted secret scan's result does not count without a security team member's approval too.
expect: DENY
changed_paths: [.github/workflows/deploy.yml]
actor_type: ai_agent
trusted_results: { gitleaks: success }   # UC4: the trusted secret scan passed (always required)
github_evidence:
  available: true
  approvals:
    - { user_id: 101, login: platform-reviewer, review_id: 1, teams: [ArbiterControl-Test/e4-platform] }
  checks: []
