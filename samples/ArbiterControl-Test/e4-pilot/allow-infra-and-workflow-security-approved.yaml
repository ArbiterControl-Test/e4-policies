# Must allow: an infrastructure change together with its Terraform workflow, approved by platform and, because the
# workflow defines how the plan check runs, by security; the plan check passes.
expect: ALLOW
changed_paths: [infrastructure/network/vpc.tf, .github/workflows/terraform.yml]
actor_type: human
trusted_results: { gitleaks: success }   # UC4: the trusted secret scan passed (always required)
github_evidence:
  available: true
  approvals:
    - { user_id: 101, login: platform-reviewer, review_id: 1, teams: [ArbiterControl-Test/e4-platform] }
    - { user_id: 202, login: security-reviewer, review_id: 2, teams: [ArbiterControl-Test/e4-security] }
  checks: [{ name: terraform-plan, app_id: 15368, workflow: .github/workflows/terraform.yml, check_run_id: 11, status: completed, conclusion: success }]
